url: https://r-causal.github.io/causalgenerics/

template:
  bootstrap: 5
  math-rendering: mathjax

reference:
- title: Generics
  desc: >
    The S3 generics the r-causal ecosystem shares. Packages register methods on
    these rather than defining their own, so attaching several at once produces
    no masking.
  contents:
  - ipw
  - ipw-modes
  - ess
  - causal-weights
- title: Shared classes
  desc: >
    Constructors and helpers for the classes those generics return. Method
    authors build on these instead of writing a result or weight class of their
    own.
  contents:
  - new_ipw
  - new_ipw_model
  - ipw-accessors
  - pool_ipw
  - ipw-pooled-methods
  - new_causal_wts
  - causal_wts_ptype2
- title: Exposure declarations
  desc: >
    Classes for the exposure an analysis is estimated from rather than for what
    it returns. A package handed such a column reads the declaration off it
    instead of inferring the design from the values it holds.
  contents:
  - joint_exposure
  - joint-exposure-accessors
- title: Exposure types
  desc: >
    The reading of whether an exposure is binary, categorical, or continuous,
    and the resolution of the type a caller declared against the types a
    function supports. Packages take the reading from here so that the same
    column is treated the same way wherever it is analyzed.
  contents:
  - detect_exposure_type
  - match_exposure_type
  - check_forced_type
  - exposure-type-helpers
